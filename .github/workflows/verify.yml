name: Verify published metrics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.3 scipy==1.13.1 pandas==1.5.3 scikit-learn==1.6.1
      - run: python scripts/verify_metrics.py
